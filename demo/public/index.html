<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pocket-tts demo</title>
<style>
  :root { --bg:#0d0f12; --panel:#171a1f; --border:#2a2f36; --text:#e8eaed; --muted:#9aa3ad; --accent:#00d4aa; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:ui-monospace,monospace; background:var(--bg); color:var(--text); display:flex; justify-content:center; padding:2rem 1rem; }
  main { width:100%; max-width:640px; display:flex; flex-direction:column; gap:1rem; }
  h1 { font-size:1.2rem; margin:0; }
  h1 span { color:var(--accent); }
  label { display:block; font-size:.75rem; color:var(--muted); margin-bottom:.25rem; }
  textarea, select, button { font:inherit; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:.5rem; width:100%; }
  textarea { resize:vertical; min-height:4.5rem; }
  .row { display:flex; gap:.75rem; }
  .row > * { flex:1; }
  button { cursor:pointer; transition:border-color .15s; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.primary { background:var(--accent); color:#04140f; border-color:var(--accent); font-weight:700; }
  #stats { font-size:.75rem; color:var(--muted); display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; }
  #stats b { color:var(--text); display:block; font-size:1rem; }
  #status { font-size:.8rem; min-height:1.2rem; }
  #status.error { color:var(--err); }
  .bars { display:flex; align-items:flex-end; gap:2px; height:48px; background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:.4rem; }
  .bars i { flex:1; background:var(--accent); border-radius:1px; min-height:1px; opacity:.8; }
  .badge { display:inline-block; font-size:.65rem; border:1px solid var(--border); border-radius:4px; padding:.1rem .35rem; color:var(--muted); margin-left:.4rem; }
</style>
</head>
<body>
<main>
  <h1><span>pocket</span>-tts · real-time demo</h1>

  <div class="row">
    <div>
      <label for="mode">Mode</label>
      <select id="mode"><option value="cloud">cloud (Kyutai API)</option></select>
    </div>
    <div id="lang-wrap">
      <label for="lang">Langue</label>
      <select id="lang"></select>
    </div>
    <div id="voice-wrap">
      <label for="voice">Voice</label>
      <select id="voice"></select>
    </div>
  </div>

  <div>
    <label for="text">Text</label>
    <textarea id="text">Bonjour ! Ce texte est synthétisé en temps réel, audio streamé dès les premières millisecondes.</textarea>
  </div>

  <div class="row">
    <button id="play" class="primary">▶ Play (real-time)</button>
    <button id="stop" disabled>■ Stop</button>
    <button id="wav">⬇ WAV</button>
  </div>

  <div class="bars" id="bars"></div>

  <div id="stats">
    <div>TTFB<b id="ttfb">—</b></div>
    <div>Audio<b id="dur">—</b></div>
    <div>Chunks<b id="chunks">—</b></div>
  </div>
  <div id="status"></div>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const SAMPLE_RATE = 24000;

let config = null;
let audioCtx = null;
let workletNode = null;
let playing = false;
let abortCtl = null;

// ---- AudioWorklet: gapless scheduling of incoming PCM chunks ----
const WORKLET_SRC = `
class PocketPlayer extends AudioWorkletProcessor {
  constructor() {
    super();
    this.queue = [];      // pending Float32Array chunks
    this.offset = 0;      // read position in the head chunk
    this.gain = 0;        // smoothed gain (kills underrun clicks)
    this.samplesPlayed = 0;
    this.port.onmessage = (e) => {
      if (e.data === 'flush') { this.port.postMessage({ samplesPlayed: this.samplesPlayed }); }
      else this.queue.push(e.data);
    };
  }
  process(inputs, outputs) {
    const out = outputs[0][0];
    out.fill(0);
    let need = out.length;
    let pos = 0;
    while (need > 0 && this.queue.length > 0) {
      const head = this.queue[0];
      const avail = head.length - this.offset;
      const take = Math.min(avail, need);
      out.set(head.subarray(this.offset, this.offset + take), pos);
      this.offset += take; pos += take; need -= take;
      this.samplesPlayed += take;
      if (this.offset >= head.length) { this.queue.shift(); this.offset = 0; }
    }
    // Smooth gain: ramp toward 1 while fed, toward 0 on underrun.
    // Local mode generates slower than realtime, so underruns are
    // normal — this turns hard clicks into short crossfades (~20ms).
    const target = pos === out.length ? 1 : 0;
    const step = 1 / 960;
    for (let i = 0; i < out.length; i++) {
      if (this.gain < target) this.gain = Math.min(target, this.gain + step);
      else if (this.gain > target) this.gain = Math.max(target, this.gain - step);
      out[i] *= this.gain;
    }
    return true;
  }
}
registerProcessor('pocket-player', PocketPlayer);
`;

async function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE, latencyHint: 'interactive' });
    const blob = new Blob([WORKLET_SRC], { type: 'application/javascript' });
    await audioCtx.audioWorklet.addModule(URL.createObjectURL(blob));
  }
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  if (workletNode) workletNode.disconnect();
  workletNode = new AudioWorkletNode(audioCtx, 'pocket-player');
  workletNode.connect(audioCtx.destination);
  return workletNode;
}

// ---- Live visualizer ----
const barsEl = $('bars');
const BAR_COUNT = 48;
const bars = Array.from({ length: BAR_COUNT }, () => {
  const i = document.createElement('i');
  barsEl.appendChild(i);
  return i;
});
function drawLevel(level) {
  for (let i = 0; i < BAR_COUNT; i++) {
    const v = i <= level * BAR_COUNT ? (0.2 + 0.8 * Math.random()) : 0.06;
    bars[i].style.height = `${Math.round(v * 100)}%`;
  }
}
function drawIdle() { drawLevel(0); }

// ---- Config loading ----
async function loadConfig() {
  config = await (await fetch('/api/config')).json();
  const modeSel = $('mode');
  modeSel.innerHTML = '';
  modeSel.appendChild(new Option('cloud — Kyutai API (24 voix)', 'cloud'));
  if (config.local.enabled) {
    modeSel.appendChild(new Option(`local — clonage (${config.local.languages.join(', ')})`, 'local'));
    if (!config.local.ready) {
      setStatus('Chargement du modèle local + clonage de la voix (~10s)…');
      fetch('/api/local/prepare', { method: 'POST' }).then(() => setStatus(''));
    }
  }
  modeSel.onchange = () => { fillLangs(); fillVoices(); };
  fillLangs();
  fillVoices();
}

function fillLangs() {
  const sel = $('lang');
  sel.innerHTML = '';
  if ($('mode').value === 'cloud') {
    for (const l of config.cloud.languages) sel.appendChild(new Option(l, l));
    sel.value = 'french';
    sel.disabled = false;
    sel.onchange = () => {
      // Voices are language-agnostic; keep selection if still valid.
      fillVoices();
    };
  } else {
    sel.appendChild(new Option('bundle du serveur', ''));
    sel.disabled = true;
  }
}

function fillVoices() {
  const sel = $('voice');
  const previous = sel.value;
  sel.innerHTML = '';
  if ($('mode').value === 'cloud') {
    // Put the selected language's native voices first.
    const lang = $('lang').value;
    const sorted = [...config.cloud.voices].sort((a, b) =>
      (b.languageHint === lang) - (a.languageHint === lang),
    );
    for (const v of sorted) {
      const tag = v.languageHint ? ` · ${v.languageHint}` : '';
      sel.appendChild(new Option(`${v.name} (${v.gender[0]}, ${v.style})${tag}`, v.id));
    }
    if ([...sel.options].some((o) => o.value === previous)) sel.value = previous;
    sel.disabled = false;
  } else {
    sel.appendChild(new Option('ma voix (POCKET_VOICE)', ''));
    sel.disabled = true;
  }
}

function setStatus(msg, isError = false) {
  const el = $('status');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
}

// ---- Real-time playback ----
async function play() {
  if (playing) return;
  const text = $('text').value.trim();
  if (!text) { setStatus('Texte vide.', true); return; }
  playing = true;
  $('play').disabled = true;
  $('stop').disabled = false;
  setStatus('Génération…');
  $('ttfb').textContent = '—'; $('dur').textContent = '—'; $('chunks').textContent = '0';

  const t0 = performance.now();
  let firstAt = null, chunks = 0, samples = 0;
  let carry = new Uint8Array(0); // holds an odd trailing byte between chunks
  let pending = new Float32Array(0); // small prebuffer: start after 200ms
  const PREBUFFER = SAMPLE_RATE / 5;
  let started = false;
  abortCtl = new AbortController();
  try {
    const node = await ensureAudio();
    const res = await fetch('/api/tts/stream', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text, mode: $('mode').value, voice: $('voice').value, language: $('lang').value }),
      signal: abortCtl.signal,
    });
    if (!res.ok) throw new Error((await res.json()).error ?? res.statusText);

    const send = (f32) => {
      node.port.postMessage(f32, [f32.buffer]);
      chunks++; samples += f32.length;
      $('chunks').textContent = String(chunks);
      $('dur').textContent = `${(samples / SAMPLE_RATE).toFixed(1)}s`;
    };

    const reader = res.body.getReader();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      if (firstAt === null) { firstAt = performance.now() - t0; $('ttfb').textContent = `${Math.round(firstAt)}ms`; setStatus('Lecture en cours…'); }
      // Reassemble complete int16 samples across chunk boundaries
      // (network chunks can split a sample; a stray byte would shift
      // every following sample and produce static).
      const merged = new Uint8Array(carry.length + value.length);
      merged.set(carry, 0); merged.set(value, carry.length);
      const count = merged.length >> 1;
      if (count === 0) { carry = merged; continue; }
      const pcm16 = new Int16Array(merged.buffer, 0, count);
      carry = merged.length % 2 === 1 ? merged.slice(count * 2) : new Uint8Array(0);
      // Fade in on the very first samples to avoid a click
      const f32 = new Float32Array(pcm16.length);
      let peak = 0;
      for (let i = 0; i < pcm16.length; i++) {
        let v = pcm16[i] / 32768;
        if (!started && samples + i < 480) v *= (samples + i) / 480;
        f32[i] = v;
        if (Math.abs(v) > peak) peak = Math.abs(v);
      }
      started = true;
      if (pending.length < PREBUFFER) {
        const grown = new Float32Array(pending.length + f32.length);
        grown.set(pending); grown.set(f32, pending.length);
        pending = grown;
        if (pending.length >= PREBUFFER) { send(pending); pending = new Float32Array(0); drawLevel(Math.min(1, peak)); }
      } else {
        send(f32);
        drawLevel(Math.min(1, peak));
      }
    }
    // Flush whatever the prebuffer still holds
    if (pending.length > 0) send(pending);
    setStatus(`Terminé — TTFB ${firstAt ? Math.round(firstAt) : '?'}ms, ${(samples / SAMPLE_RATE).toFixed(2)}s d'audio`);
  } catch (err) {
    if ((err).name !== 'AbortError') setStatus(String(err.message ?? err), true);
    else setStatus('Arrêté.');
  } finally {
    playing = false;
    $('play').disabled = false;
    $('stop').disabled = true;
    abortCtl = null;
    drawIdle();
  }
}

function stop() {
  if (abortCtl) abortCtl.abort();
  if (workletNode) {
    // Drop everything queued: recreate the node for a clean restart.
    workletNode.disconnect();
    workletNode = null;
  }
}

async function downloadWav() {
  const text = $('text').value.trim();
  if (!text) return;
  setStatus('Génération du WAV…');
  try {
    const res = await fetch('/api/tts/wav', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text, mode: $('mode').value, voice: $('voice').value, language: $('lang').value }),
    });
    if (!res.ok) throw new Error((await res.json()).error ?? res.statusText);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'pocket-tts.wav';
    a.click();
    URL.revokeObjectURL(a.href);
    setStatus('WAV téléchargé.');
  } catch (err) {
    setStatus(String(err.message ?? err), true);
  }
}

$('play').onclick = play;
$('stop').onclick = stop;
$('wav').onclick = downloadWav;
drawIdle();
loadConfig().catch((e) => setStatus(`Config: ${e.message}`, true));
</script>
</body>
</html>
